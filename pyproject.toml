[project]
name = "clinicbot"
version = "0.1.0"
description = "RAG + agent learning project: a front-desk assistant for a clinic"
authors = [
    { name = "Thusala Piyarisi", email = "thusalapi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
clinicbot = "clinicbot:main"
clinicbot-mcp = "clinicbot.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
